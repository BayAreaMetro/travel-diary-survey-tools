# Processing Pipeline Configuration for the ETC vendor test data
# Downstream steps below are still the BATS 2023 defaults and have not been
# retuned for this vendor or for a 3-household test extract.

# config.yaml

# Define directory shorthands
# CSVs produced by extract_xlsx.py from the vendor workbook
survey_dir: "E:/Box/Modeling and Surveys/Surveys/Travel Diary Survey/BATS_2028/BATS_28_MTC_Partners_Shared/Pre-solicitation research/Vendor Responses/ETC_app_files/extracted_data"

output_dir: "{{ survey_dir }}/pipeline_analysis"
TM1_shapefile_dir: "E:/GitHub/travel-model-one/utilities/geographies"
TM2_shapefile_dir: "E:/GitHub/tm2py-utils/tm2py_utils/inputs/maz_taz/shapefiles"
log_file: "{{ output_dir }}/pipeline_etc.log" # If not set, logs just to console, if not absolute saves to .cache directory

# Pipeline configuration
steps:
  - name: load_data
    validate_input: false # This will override @step(validate=True/False) in the function definition
    cache: true
    params:
      # Loaded under vendor names: these are raw ETC tables, not canonical
      # ones, and conform_etc is what turns them into canonical tables.
      input_paths:
        etc_households: "{{ survey_dir }}/households.csv"
        etc_persons: "{{ survey_dir }}/persons.csv"
        etc_vehicles: "{{ survey_dir }}/vehicles.csv"
        etc_trips: "{{ survey_dir }}/trips.csv"

  # Reads the raw vendor tables and enumerates their internal contradictions.
  # Reports only; it never raises, so the whole list arrives in one pass.
  - name: check_etc_data
    validate_input: false
    cache: false
    params:
      # Both written here rather than by write_data, so the findings land
      # even when a later step cannot run on this small extract.
      findings_report_path: "{{ survey_dir }}/data_issues.md"
      findings_csv_path: "{{ survey_dir }}/data_issues.csv"

  - name: conform_etc
    validate_input: false
    # Uncached on purpose: the cache key is built from canonical inputs and
    # step params, and this step takes neither, so a cached result would
    # survive a re-extract of the workbook.


  - name: link_trips
    validate_input: true
    params:
      change_mode_enum: CHANGE_MODE
      transit_mode_enums: [FERRY, TRANSIT, LONG_DISTANCE]
      max_dwell_time: 180  # in minutes
      dwell_buffer_distance: 100  # in meters

  - name: detect_joint_trips
    validate_input: true
    params:
      config:
        method: "mahalanobis"
        # Covariance for Mahalanobis distance calculation
        # Think of this as the standard deviation of measurement noise in each dimension
        # Diagonal: [origin_var_m^2, dest_var_m^2, depart_var_min^2, arrive_var_min^2]
        # Default [10000, 10000, 100, 100] = 100m, 100m, 10min, 10min std devs
        covariance: [10000, 10000, 100, 100]
        # Confidence level: Higher = stricter matching (fewer detections)
        # 0.90 = 90% confidence (strict), 0.75 = moderate, 0.50 = permissive
        confidence_level: 0.90

        # Alternative: simpler buffer method with time/space thresholds
        # method: "buffer"
        # time_threshold_minutes: 15.0
        # space_threshold_meters: 100.0

  - name: extract_tours
    validate_input: true
    params:
      # A tour is flagged SPATIAL_GAP (and dropped by the formatters) when any
      # internal junction jumps more than this many meters between one trip's
      # destination and the next trip's origin - a missing leg the extractor
      # would otherwise weld into one "complete" tour. 1 km catches genuine
      # teleports while ignoring same-place geocoding jitter.
      spatial_gap_threshold_meters: 1000.0

  # Cascade `complete` (survey reporting) through hh <-> person <-> day <->
  # trip/tour so it is consistent with any upstream adjustments, and stamp
  # `model_usable`: the subset of complete records admissible to the tour-based
  # models (VALID tour structure + COMPLETE home-to-home category + household-
  # day coherence). Parameterless: downstream consumers choose which flag to
  # honour (weighting: usability_flag_col; formatters: drop_invalid_tours).
  - name: cascade_completeness
    validate_input: true

  - name: add_zone_ids
    validate_input: true
    params:
      projected_crs: "EPSG:26910"  # UTM Zone 10N (Bay Area metric CRS for nearest-zone fallback)
      max_snap_distance: 500  # metres; points farther from all zone boundaries remain null (out-of-region)
      zone_geographies:
        - zone_name: "taz"  # Primary TAZ for DaySim (TM1)
          shapefile: "{{ TM2_shapefile_dir }}/tazs_TM2_2_5.shp"
          zone_id_field: "TAZ_NODE"
        - zone_name: "maz"  # Primary MAZ for DaySim (TM2)
          shapefile: "{{ TM2_shapefile_dir }}/mazs_TM2_2_5.shp"
          zone_id_field: "MAZ_NODE"
        # Add additional zone geographies as needed:
        - zone_name: "TAZ1454"
          shapefile: "{{ TM1_shapefile_dir }}/bayarea_rtaz1454_rev1_WGS84.shp"
          zone_id_field: "TAZ1454"

  # - name: final_check
  #   validate_input: true

  - name: format_ctramp
    validate_input: true
    params:
      # Income thresholds (in year 2000 dollars, per CT-RAMP convention).
      # From MTC CT-RAMP INCOME_SEGMENT_DOLLAR_LIMITS = {30000, 60000, 100000, MAX}:
      # https://github.com/BayAreaMetro/travel-model-one/blob/a1c6cfb48ed3397a436170d810db91c5f9474c08/core/projects/mtc/src/java/com/pb/mtc/ctramp/MtcModelStructure.java#L14
      income_low_threshold: 30000  # below $30k -> 'work_low'
      income_med_threshold: 60000  # below $60k -> 'work_med'
      income_high_threshold: 100000  # below $100k -> 'work_high', at/above -> 'work_very high'

      # Income conversion: survey income is in 2023 dollars, but CT-RAMP income
      # categories are in year 2000 dollars. Multiply 2023 dollars by this factor to
      # convert to 2000 dollars (= 1 / 1.88; 2000 -> 2023 inflation factor is 1.88).
      # Source: https://github.com/BayAreaMetro/modeling-website/wiki/InflationAssumptions
      income_survey_year_to_ctramp_year: 0.5319148936  # = 1 / 1.88

      # Age thresholds
      age_adult: 4  # AgeCategory.AGE_18_TO_24 - Adult threshold for joint tour composition

      # Other parameters
      # This is not optimal, but model requires a binary gender
      gender_default_for_missing: "f"
      taz_field: "TAZ1454"  # TAZ field to use for CTRAMP formatting
      drop_missing_taz: true  # Drop households without valid TAZ
      drop_invalid_tours: true  # Drop non-VALID or non-COMPLETE tours (parity with DaySim)


  - name: write_data
    validate_input: true
    params:
      # The "codebook" includes all the labeled enums used in the survey datamodel.
      # This is useful to generate Tableau aliases and for summarization code.
      enum_codebook_path: "{{ output_dir }}/survey/codebook.xlsx"
      output_paths:
        # Standard Survey Formats
        households: "{{ output_dir }}/survey/households_2023.csv"
        persons: "{{ output_dir }}/survey/persons_2023.csv"
        days: "{{ output_dir }}/survey/days_2023.csv"
        unlinked_trips: "{{ output_dir }}/survey/unlinked_trips_2023.csv"
        linked_trips: "{{ output_dir }}/survey/linked_trips_2023.csv"
        tours: "{{ output_dir }}/survey/tours_2023.csv"
        joint_trips: "{{ output_dir }}/survey/joint_trips_2023.csv"
        habitual_locations: "{{ output_dir }}/survey/habitual_locations_2023.csv"
        habitual_location_days: "{{ output_dir }}/survey/habitual_location_days_2023.csv"

        # CTRAMP Formats
        households_ctramp: "{{ output_dir }}/ctramp_2023/HouseholdData.csv"
        persons_ctramp: "{{ output_dir }}/ctramp_2023/PersonData.csv"
        mandatory_locations_ctramp: "{{ output_dir }}/ctramp_2023/MandatoryLocationData.csv"
        individual_tours_ctramp: "{{ output_dir }}/ctramp_2023/IndivTourData.csv"
        individual_trips_ctramp: "{{ output_dir }}/ctramp_2023/IndivTripData.csv"
        joint_tours_ctramp: "{{ output_dir }}/ctramp_2023/JointTourData.csv"
        joint_trips_ctramp: "{{ output_dir }}/ctramp_2023/JointTripData.csv"
        cdap_results_ctramp: "{{ output_dir }}/ctramp_2023/cdapResults.csv"
        ao_results_ctramp: "{{ output_dir }}/ctramp_2023/aoResults.csv"
        # Not CT-RAMP files: individual and joint travel unified into one row per
        # person-record, so a total needs no reconciling across the two files above.
        all_tours_ctramp: "{{ output_dir }}/ctramp_2023/AllTourData.csv"
        all_trips_ctramp: "{{ output_dir }}/ctramp_2023/AllTripData.csv"
